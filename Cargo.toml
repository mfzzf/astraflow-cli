[package]
name = "astraflow-cli"
version = "0.2.2"
edition = "2024"
description = "Use AstraFlow ModelVerse with local coding agents"
license = "Apache-2.0"
repository = "https://github.com/mfzzf/astraflow-cli"
rust-version = "1.88"

[[bin]]
name = "astf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = "4.5"
dialoguer = "0.11"
directories = "6.0"
futures-util = "0.3"
is-terminal = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tempfile = "3.20"
tokio = { version = "1.47", features = ["full"] }
toml_edit = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
webbrowser = "1.0"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
